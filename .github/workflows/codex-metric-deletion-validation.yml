name: TinyBase metric deletion native validation
on:
  push:
    branches: [codex/validate-metric-deletion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    env:
      CANDIDATE_SHA: c3014a4a87f436394c821dab0535212556ab740c
      ORIGINAL_SHA: 393865864c8ad317971cf6d3ebfd65943830a772
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peterolkhov/tinybase
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Guard exact candidate HEAD, parent, file list and source hashes
        run: |
          python3 - <<'PY_GUARD'
          import base64, hashlib, json, os, pathlib, subprocess
          manifest=json.loads(base64.b64decode(''))
          git=lambda *args: subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['CANDIDATE_SHA']
          assert git('rev-parse','HEAD^')==os.environ['ORIGINAL_SHA']
          assert git('status','--porcelain')==''
          assert sorted(git('diff','--name-only',os.environ['ORIGINAL_SHA'],'HEAD').splitlines())==sorted(f['path'] for f in manifest['files'])
          for f in manifest['files']:
              assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['after_sha256'],f
              old=subprocess.check_output(['git','show',os.environ['ORIGINAL_SHA']+':'+f['path']])
              assert hashlib.sha256(old).hexdigest()==f['original_sha256'],f
              assert git('rev-parse',os.environ['ORIGINAL_SHA']+':'+f['path'])==f['original_git_blob'],f
          print('TINYBASE_CANDIDATE_GUARDS_PASS')
          PY_GUARD
      - name: Restore exact original production owner for negative control
        if: matrix.version == 'before'
        run: |
          git show "$ORIGINAL_SHA:src/metrics/index.ts" > src/metrics/index.ts
          test "$(git hash-object src/metrics/index.ts)" = 2295500007e9a5b97ae3b684629ccb077857c893
          test "$(git diff --name-only)" = src/metrics/index.ts
      - run: npm ci --legacy-peer-deps
      - run: npm run compileForTest
      - name: Native affected tests are RED on the original owner
        if: matrix.version == 'before'
        run: |
          set +e
          npx vitest run --project unit test/unit/core/other/metrics.test.ts test/unit/core/ui-react/components.test.tsx --reporter=json --outputFile=native-before.json
          product_status=$?
          set -e
          cat native-before.json
          test "$product_status" -eq 1
          python3 - <<'PY_RED'
          import json, pathlib
          d=json.loads(pathlib.Path('native-before.json').read_text())
          results=[a for r in d['testResults'] for a in r['assertionResults']]
          failed=[a for a in results if a['status']=='failed']
          assert len(failed)==6,[(a['fullName'],a['status']) for a in results]
          assert all('AssertionError' in '\n'.join(a['failureMessages']) for a in failed),failed
          assert len([a for a in failed if 'notifies with old value' in a['fullName']])==2
          assert any('MetricView follows metric deletion and recreation' in a['fullName'] for a in failed)
          assert all(a['status']=='passed' for a in results if 'does not report stale removal' in a['fullName'] or 'respects listener removal' in a['fullName'])
          print('TINYBASE_NATIVE_RED_CONFIRMED',len(failed))
          PY_RED
      - name: Native affected tests are GREEN with the candidate
        if: matrix.version == 'after'
        run: npx vitest run --project unit test/unit/core/other/metrics.test.ts test/unit/core/ui-react/components.test.tsx
      - name: Unchanged independently reproduced public fixture
        env:
          VERSION: ${{ matrix.version }}
        run: |
          python3 - <<'PY_FIXTURE'
          import base64, hashlib, pathlib
          p=pathlib.Path('test/unit/core/metric-deletion-before.test.tsx')
          assert not p.exists()
          fixture=base64.b64decode('')
          assert hashlib.sha256(fixture).hexdigest()=='bd7299a7d6b9f9895ccb3122affdf022940d84da57c012ab60ba5326d89c8edd'
          p.write_bytes(fixture)
          PY_FIXTURE
          set +e
          npx vitest run --project unit test/unit/core/metric-deletion-before.test.tsx --reporter=json --outputFile=public-fixture.json
          product_status=$?
          set -e
          cat public-fixture.json
          PRODUCT_STATUS="$product_status" python3 - <<'PY_PUBLIC'
          import json, os, pathlib
          d=json.loads(pathlib.Path('public-fixture.json').read_text())
          before=os.environ['VERSION']=='before'
          assert int(os.environ['PRODUCT_STATUS'])==(1 if before else 0)
          assert d['numTotalTests']==4
          assert d['numFailedTests']==(2 if before else 0)
          assert d['numPassedTests']==(2 if before else 4)
          failed={a['title'] for r in d['testResults'] for a in r['assertionResults'] if a['status']=='failed'}
          assert failed==({'public deletion notifies specific and wildcard value subscribers','native MetricView clears the removed metric'} if before else set()),failed
          print('TINYBASE_PUBLIC_FIXTURE',os.environ['VERSION'],d['numPassedTests'],d['numFailedTests'])
          PY_PUBLIC
          rm test/unit/core/metric-deletion-before.test.tsx
      - name: Official CI lint
        if: matrix.version == 'after'
        run: npm run lint
      - name: Official CI spell
        if: matrix.version == 'after'
        run: npm run spell
      - name: Official CI TypeScript
        if: matrix.version == 'after'
        run: npm run ts
      - name: Official CI whole-core tests with native coverage
        if: matrix.version == 'after'
        run: npm run testUnitFast
      - name: Assert configured four-bundle coverage is 100 percent
        if: matrix.version == 'after'
        run: |
          python3 - <<'PY_COVERAGE'
          import json,pathlib
          d=json.loads(pathlib.Path('tmp/coverage/coverage-summary.json').read_text())
          bundles={'dist/index.js','dist/ui-react/index.js','dist/ui-solid/index.js','dist/ui-svelte/index.js'}
          found={name: next((v for k,v in d.items() if k.endswith('/'+name)),None) for name in bundles}
          assert all(found.values()),list(d)
          for name,report in {'total':d['total'],**found}.items():
              for kind in ['lines','statements','functions','branches']:
                  assert report[kind]['pct']==100,(name,kind,report[kind])
          print('TINYBASE_FOUR_BUNDLE_COVERAGE_100',json.dumps(found))
          PY_COVERAGE
      - name: Final source hashes and diff whitespace
        if: matrix.version == 'after'
        run: |
          git diff --check "$ORIGINAL_SHA" HEAD
          test -z "$(git diff --name-only)"
          python3 - <<'PY_FINAL'
          import base64,hashlib,json,pathlib
          for f in json.loads(base64.b64decode(''))['files']:
              assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['after_sha256'],f
          print('TINYBASE_FINAL_SOURCE_HASHES_PASS')
          PY_FINAL
